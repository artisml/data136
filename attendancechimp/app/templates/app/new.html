<!DOCTYPE html>
<html>
<head>
    <title>Sign Up</title>
</head>
<body style="text-align:center; font-family:Arial;">
    <h1>Sign Up</h1>

    <form action="/app/createUser" method="post">
        {% csrf_token %}

        <p>
            <label>Username:
                <input type="text" name="user_name" required>
            </label>
        </p>

        <p>
            <label>Email:
                <input type="email" name="email" required>
            </label>
        </p>

        <p>
            <label>Password:
                <input type="password" name="password" required>
            </label>
        </p>

        <p>
            <label>
                <input type="radio" name="is_student" value="1" required>
                Student
            </label>

            <label>
                <input type="radio" name="is_student" value="0">
                Instructor
            </label>
        </p>

        <button type="submit">Sign Up</button>
    </form>

    <p><a href="/app/">Home</a></p>
</body>
</html>
